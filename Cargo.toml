[package]
name = "litehouse"
version = "0.2.0-alpha.28"
edition = "2024"
description = "Self-hosted git push deploys for SQLite apps, on your own server"
license = "MIT"
authors = ["Dan Bruder <danbruder@hey.com>"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "json", "chrono", "uuid", "macros"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
thiserror = "2.0"
tempfile = "3.9"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
toml = "1.2"
bollard = {version = "0.15"}
axum = "0.6"
futures-util = "0.3"
bytes = "1"
indicatif = "0.18"
rand = "0.10"
sha2 = "0.11"
hex = "0.4"
hmac = "0.13"
urlencoding = "2.1"
tar = "0.4"
flate2 = "1.0"
walkdir = "2.4"
crypto_box = { version = "0.9", features = ["seal"] }
base64 = "0.23"
# S3 SDK without its default HTTPS client: that one is rustls on aws-lc-rs,
# whose C build (aws-lc-sys, cmake) dominated clean builds. backup::s3_client
# plugs in a rustls-on-ring client instead — the same ring reqwest already
# uses. sigv4a (multi-region access points only) is off too.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "http-1x"] }
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }
aws-credential-types = "1"
askama = "0.16"
# Both already in the tree (axum, bollard); caddy.rs uses them to reach
# Caddy's admin API over its unix socket.
hyper = "0.14"
hyperlocal = "0.8"

[dev-dependencies]
# In-process router tests (tower::ServiceExt::oneshot; hyper is a normal dep).
tower = "0.4"

[[bin]]
name = "lh"
path = "src/main.rs"

[features]
default = []
vendored-openssl = []

# Dev/test builds are tuned for the edit-compile loop (humans and agents):
# line tables keep panics' file:line backtraces but drop the full debug info
# that dominated codegen and link time; dependencies get none at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
