name: Build and Release Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Each architecture builds natively on its own runner: aws-lc-sys (pulled in
  # by the S3 SDK) compiles C and is painful to cross-compile to musl.
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            docker_arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: aarch64
            docker_arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-musl-

      - name: Build release binary
        env:
          TARGET_CC: musl-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist image-context/${{ matrix.docker_arch }}
          cp target/${{ matrix.target }}/release/lh dist/
          cp target/${{ matrix.target }}/release/lh image-context/${{ matrix.docker_arch }}/lh
          cd dist
          tar -czvf litehouse-linux-${{ matrix.arch }}.tar.gz lh
          sha256sum litehouse-linux-${{ matrix.arch }}.tar.gz > litehouse-linux-${{ matrix.arch }}.tar.gz.sha256
          rm lh

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/
          retention-days: 1

      - name: Upload image build context
        uses: actions/upload-artifact@v4
        with:
          name: image-context-${{ matrix.docker_arch }}
          path: image-context/
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-image:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
      actions: read # artifact download from the build job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image build contexts
        uses: actions/download-artifact@v4
        with:
          pattern: image-context-*
          path: image-context
          merge-multiple: true

      - name: Stage Dockerfile
        run: cp Dockerfile image-context/Dockerfile

      - name: Compute image tag (strip leading v)
        id: version
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image only runs `apk add` on top of the prebuilt binaries, so
      # emulating arm64 here is cheap.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: image-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/danbruder/litehouse:${{ steps.version.outputs.version }}
            ghcr.io/danbruder/litehouse:latest

  deploy:
    needs: [release, publish-image]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: SSH and upgrade litehouse on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LITEHOUSE_SERVER_HOST }}
          username: ${{ secrets.LITEHOUSE_SERVER_USER }}
          key: ${{ secrets.LITEHOUSE_SERVER_SSH_KEY }}
          script: sudo /usr/local/bin/lh upgrade
