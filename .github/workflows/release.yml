name: Build and Release Binary

# Two ways to ship:
#   - Push a `v*` tag (./release.sh): GitHub Release + `:<version>`/`:latest`
#     image, then `lh upgrade` on the server.
#   - Push/merge to main, or run this workflow by hand (Actions → "Run
#     workflow", or `gh workflow run release.yml --ref <branch>`): builds that commit,
#     pushes `:sha-<short>`/`:edge`, and deploys it to the server with
#     `lh upgrade --from-path ... --image-tag sha-<short>`. No tag, no
#     version bump, no GitHub Release, and `:latest` is left alone.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Each Linux architecture builds natively on its own runner: ring (rustls's
  # crypto) compiles C and assembly, which is painful to cross-compile to
  # musl. macOS builds are CLI-only (for `lh` on laptops, via install-cli.sh);
  # both come from the Apple Silicon runner, whose toolchain targets Intel too.
  build:
    strategy:
      matrix:
        include:
          - os: linux
            arch: x86_64
            docker_arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - os: linux
            arch: aarch64
            docker_arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-latest
          - os: darwin
            arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Registry + compiled dependencies per target (rust-cache adds the
      # Cargo.lock and toolchain hashes to the key).
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: |
          if [ "${{ matrix.os }}" = linux ]; then export TARGET_CC=musl-gcc; fi
          cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          ASSET=litehouse-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lh dist/
          cd dist
          tar -czvf "$ASSET" lh
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          rm lh

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          retention-days: 1

      - name: Stage image build context
        if: matrix.os == 'linux'
        run: |
          mkdir -p image-context/${{ matrix.docker_arch }}
          cp target/${{ matrix.target }}/release/lh image-context/${{ matrix.docker_arch }}/lh

      - name: Upload image build context
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: image-context-${{ matrix.docker_arch }}
          path: image-context/
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read # artifact download from the build job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image build contexts
        uses: actions/download-artifact@v4
        with:
          pattern: image-context-*
          path: image-context
          merge-multiple: true

      - name: Stage Dockerfile
        run: cp Dockerfile image-context/Dockerfile

      # Tag pushes publish `:<version>` (leading v stripped) and `:latest`.
      # Main pushes and manual runs publish `:sha-<short>` and `:edge` so `:latest` keeps
      # meaning "newest tagged release" for fresh installs.
      - name: Compute image tags
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${RAW_TAG#v}"
            {
              echo "tags<<EOF"
              echo "ghcr.io/danbruder/litehouse:${VERSION}"
              echo "ghcr.io/danbruder/litehouse:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "ghcr.io/danbruder/litehouse:sha-${GITHUB_SHA::7}"
              echo "ghcr.io/danbruder/litehouse:edge"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image only runs `apk add` on top of the prebuilt binaries, so
      # emulating arm64 here is cheap.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: image-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}

  deploy:
    needs: [release, publish-image]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # Shared with deploy-commit: ./release.sh pushes main and the tag
    # together, so both deploys run; this keeps them from overlapping.
    concurrency:
      group: litehouse-server-deploy
      cancel-in-progress: false

    steps:
      - name: SSH and upgrade litehouse on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LITEHOUSE_SERVER_HOST }}
          username: ${{ secrets.LITEHOUSE_SERVER_USER }}
          key: ${{ secrets.LITEHOUSE_SERVER_SSH_KEY }}
          script: sudo /usr/local/bin/lh upgrade

  # Pushes to main and manual runs: deploy exactly this commit. The container
  # runs the `sha-<short>` image pushed above, not the image named by
  # Cargo.toml's version (between releases that's the previous release). The
  # host `lh` binary comes out of that same image, so nothing needs copying
  # over SSH (scp-action misdetected the server as Windows and failed).
  deploy-commit:
    needs: publish-image
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    concurrency:
      group: litehouse-server-deploy
      cancel-in-progress: false

    steps:
      - name: SSH and upgrade litehouse to this commit
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LITEHOUSE_SERVER_HOST }}
          username: ${{ secrets.LITEHOUSE_SERVER_USER }}
          key: ${{ secrets.LITEHOUSE_SERVER_SSH_KEY }}
          script: |
            set -e
            TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
            IMAGE="ghcr.io/danbruder/litehouse:$TAG"
            BIN=/tmp/lh-$TAG
            sudo docker pull "$IMAGE"
            CID="$(sudo docker create "$IMAGE")"
            sudo docker cp "$CID:/usr/local/bin/lh" "$BIN"
            sudo docker rm "$CID" >/dev/null
            sudo chmod +x "$BIN"
            sudo "$BIN" upgrade --from-path "$BIN" --image-tag "$TAG"
            sudo rm -f "$BIN"
