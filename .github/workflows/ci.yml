name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Queries are checked against the committed .sqlx/ cache, not a live DB.
  SQLX_OFFLINE: "true"

jobs:
  rust:
    name: Rust (clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Caches the registry and compiled dependencies (not litehouse itself),
      # keyed on Cargo.lock + toolchain, and re-saves when they change.
      # Only main saves, so PR runs restore main's warm cache instead of each
      # writing its own copy into the 10 GB repo cache limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The Docker integration tests assume a host that looks like a litehouse
      # server: the images they run are already pulled (docker::run never
      # pulls) and the shared bridge network exists (caddy::start makes it).
      - name: Prepare Docker for integration tests
        run: |
          docker pull -q redis:7.4-alpine
          docker pull -q alpine:3.24
          docker pull -q nginx:alpine
          docker network create litehouse-network

      # Tests marked #[ignore] (MinIO round-trips) stay skipped.
      - name: Tests
        run: cargo test

  frontend:
    name: Admin UI (typecheck + committed build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `npm run build` type-checks and writes to ../src/ui/spa/. cargo embeds
      # those committed files and never runs npm, so fail if they're stale.
      - name: Build
        run: npm run build

      - name: Committed SPA bundle is up to date
        run: |
          if ! git diff --exit-code --stat -- ../src/ui/spa; then
            echo "::error::src/ui/spa/ is out of date. Run 'cd frontend && npm run build' and commit the result."
            exit 1
          fi
