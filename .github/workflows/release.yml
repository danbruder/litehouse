name: Build and Release Binary

# Two ways to ship:
#   - Push a `v*` tag (./release.sh): GitHub Release + `:<version>`/`:latest`
#     image, then `lh upgrade` on the server.
#   - Push/merge to main, or run this workflow by hand (Actions → "Run
#     workflow", or `gh workflow run release.yml --ref <branch>`): builds that commit,
#     pushes `:sha-<short>`/`:edge`, and deploys it to the server with
#     `lh upgrade --from-path ... --image-tag sha-<short>`. No tag, no
#     version bump, no GitHub Release, and `:latest` is left alone.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Only the platform the server runs on (DigitalOcean droplets are
  # linux/x86_64) is built, for every kind of run including tags: no arm64,
  # no macOS. To bring a platform back, add a matrix entry (arm64 needs
  # `ubuntu-24.04-arm`, a `docker_arch: arm64` image context, and
  # `linux/arm64` in publish-image's platforms; ring's C/assembly makes
  # cross-compiling to musl painful, so build natively).
  build:
    strategy:
      matrix:
        include:
          - os: linux
            arch: x86_64
            docker_arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
    # Back-to-back merges to main: a newer commit's build cancels the older
    # one still in flight (its publish/deploy jobs then skip). Tag builds are
    # never cancelled, and the deploy jobs have their own non-cancelling
    # concurrency group, so a running `lh upgrade` is never interrupted.
    concurrency:
      group: release-build-${{ github.ref }}-${{ matrix.os }}-${{ matrix.arch }}
      cancel-in-progress: ${{ github.ref_type != 'tag' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Registry + compiled dependencies per target (rust-cache adds the
      # Cargo.lock and toolchain hashes to the key).
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: |
          if [ "${{ matrix.os }}" = linux ]; then export TARGET_CC=musl-gcc; fi
          cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          ASSET=litehouse-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lh dist/
          cd dist
          tar -czvf "$ASSET" lh
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          rm lh

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          retention-days: 1

      - name: Stage image build context
        if: matrix.os == 'linux'
        run: |
          mkdir -p image-context/${{ matrix.docker_arch }}
          cp target/${{ matrix.target }}/release/lh image-context/${{ matrix.docker_arch }}/lh

      - name: Upload image build context
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: image-context-${{ matrix.docker_arch }}
          path: image-context/
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  publish-image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read # artifact download from the build job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download image build contexts
        uses: actions/download-artifact@v8
        with:
          pattern: image-context-*
          path: image-context
          merge-multiple: true

      - name: Stage Dockerfile
        run: cp Dockerfile image-context/Dockerfile

      # Tag pushes publish `:<version>` (leading v stripped) and `:latest`.
      # Main pushes and manual runs publish `:sha-<short>` and `:edge` so `:latest` keeps
      # meaning "newest tagged release" for fresh installs.
      - name: Compute image tags
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${RAW_TAG#v}"
            {
              echo "tags<<EOF"
              echo "ghcr.io/danbruder/litehouse:${VERSION}"
              echo "ghcr.io/danbruder/litehouse:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "ghcr.io/danbruder/litehouse:sha-${GITHUB_SHA::7}"
              echo "ghcr.io/danbruder/litehouse:edge"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: image-context
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.tags }}

  deploy:
    needs: [release, publish-image]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # Shared with deploy-commit: ./release.sh pushes main and the tag
    # together, so both deploys run; this keeps them from overlapping.
    concurrency:
      group: litehouse-server-deploy
      cancel-in-progress: false

    steps:
      # The CI key's forced command is /usr/local/bin/litehouse-ci-deploy
      # (scripts/litehouse-ci-deploy.sh); any request other than
      # `deploy-commit <sha>` runs `lh upgrade` to the latest release.
      - name: SSH and upgrade litehouse on the server
        id: ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LITEHOUSE_SERVER_HOST }}
          username: ${{ secrets.LITEHOUSE_SERVER_USER }}
          key: ${{ secrets.LITEHOUSE_SERVER_SSH_KEY }}
          capture_stdout: true
          script: upgrade

      - name: Verify the server runs this release
        env:
          SSH_STDOUT: ${{ steps.ssh.outputs.stdout }}
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED="ghcr.io/danbruder/litehouse:${RAW_TAG#v}"
          GOT="$(printf '%s\n' "$SSH_STDOUT" | sed -n 's/^LITEHOUSE_DEPLOYED_IMAGE=//p' | tail -1)"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::Server reports litehouse-server image '${GOT:-<none>}', expected '$EXPECTED'. If <none>, the CI key's authorized_keys command= is not /usr/local/bin/litehouse-ci-deploy."
            exit 1
          fi
          echo "Server is running $GOT"

  # Pushes to main and manual runs: deploy exactly this commit. The CI key's
  # forced command (/usr/local/bin/litehouse-ci-deploy, from
  # scripts/litehouse-ci-deploy.sh) does the work on the server: pull
  # `sha-<short>`, take `lh` out of that image, `lh upgrade --from-path ...
  # --image-tag sha-<short>`, then report the running image. The next step
  # fails the job unless that is this commit's image.
  deploy-commit:
    needs: publish-image
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    concurrency:
      group: litehouse-server-deploy
      cancel-in-progress: false

    steps:
      - name: SSH and deploy this commit
        id: ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LITEHOUSE_SERVER_HOST }}
          username: ${{ secrets.LITEHOUSE_SERVER_USER }}
          key: ${{ secrets.LITEHOUSE_SERVER_SSH_KEY }}
          capture_stdout: true
          script: deploy-commit ${{ github.sha }}

      - name: Verify the server runs this commit
        env:
          SSH_STDOUT: ${{ steps.ssh.outputs.stdout }}
        run: |
          EXPECTED="ghcr.io/danbruder/litehouse:sha-${GITHUB_SHA::7}"
          GOT="$(printf '%s\n' "$SSH_STDOUT" | sed -n 's/^LITEHOUSE_DEPLOYED_IMAGE=//p' | tail -1)"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::Server reports litehouse-server image '${GOT:-<none>}', expected '$EXPECTED'. If <none>, the CI key's authorized_keys command= is not /usr/local/bin/litehouse-ci-deploy."
            exit 1
          fi
          echo "Server is running $GOT"
