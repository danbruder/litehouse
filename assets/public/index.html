<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litehouse Admin</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-litehouse-bg text-litehouse-text">
    <div id="elm"></div>
    <script src="/app.js?v=2"></script>
    <script src="/sse-manager.js"></script>
    <script>
        // Token storage keys
        var TOKEN_KEY = 'litehouse_token';
        var REFRESH_TOKEN_KEY = 'litehouse_refresh_token';

        // Get stored tokens
        var storedToken = localStorage.getItem(TOKEN_KEY);
        var storedRefreshToken = localStorage.getItem(REFRESH_TOKEN_KEY);

        // Initialize Elm app with flags
        var app = Elm.Main.init({
            node: document.getElementById('elm'),
            flags: {
                token: storedToken
            }
        });

        // Port: Save token to localStorage
        app.ports.saveToken.subscribe(function(token) {
            localStorage.setItem(TOKEN_KEY, token);
        });

        // Port: Save refresh token to localStorage
        app.ports.saveRefreshToken.subscribe(function(refreshToken) {
            localStorage.setItem(REFRESH_TOKEN_KEY, refreshToken);
        });

        // Port: Get refresh token from localStorage
        app.ports.getRefreshToken.subscribe(function() {
            var refreshToken = localStorage.getItem(REFRESH_TOKEN_KEY);
            app.ports.refreshTokenReceived.send(refreshToken);
        });

        // Port: Clear tokens from localStorage
        app.ports.clearToken.subscribe(function() {
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(REFRESH_TOKEN_KEY);
        });

        // Unified SSE Manager
        var sseManager = null;

        // Port: Connect to unified SSE endpoint
        app.ports.connectSSE.subscribe(function(config) {
            var token = config.token;
            var filters = config.filters;

            // Disconnect existing connection if any
            if (sseManager) {
                sseManager.disconnect();
            }

            // Parse filters from Elm's Maybe Value
            var parsedFilters = {};
            if (filters) {
                try {
                    parsedFilters = filters;
                } catch (e) {
                    console.error('Failed to parse SSE filters:', e);
                }
            }

            // Create new SSE manager
            sseManager = new SSEManager(
                window.location.origin,
                token,
                function(event) {
                    // Send events to Elm via sseEvent port
                    app.ports.sseEvent.send(event);
                },
                function(state) {
                    // Send connection state to Elm via sseConnectionState port
                    app.ports.sseConnectionState.send(state);
                }
            );

            // Connect with filters
            sseManager.connect(parsedFilters);
        });

        // Port: Disconnect from SSE
        app.ports.disconnectSSE.subscribe(function() {
            if (sseManager) {
                sseManager.disconnect();
                sseManager = null;
            }
        });

        // Track current EventSource connection
        var githubEventSource = null;

        // Port: Start GitHub SSE connection
        app.ports.startGitHubSSE.subscribe(function(config) {
            // Close any existing connection
            if (githubEventSource) {
                githubEventSource.close();
            }

            // Build URL with query params
            var url = '/api/github/connect/stream?device_code=' + encodeURIComponent(config.deviceCode) +
                      '&interval=' + config.interval +
                      '&expires_in=' + config.expiresIn;

            // Create EventSource with authorization header via fetch
            // Note: EventSource doesn't support custom headers, so we use a workaround
            // by including auth in the URL or using cookies. For now, we'll rely on
            // the session being authenticated via cookies or we need to use fetch-event-source.

            // Simple workaround: Use a fetch-based SSE reader
            fetchSSE(url, config.token);
        });

        function fetchSSE(url, token) {
            fetch(url, {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Accept': 'text/event-stream'
                }
            }).then(function(response) {
                if (!response.ok) {
                    app.ports.gitHubSSEEvent.send({
                        type: 'error',
                        data: 'Failed to connect: ' + response.status
                    });
                    return;
                }

                var reader = response.body.getReader();
                var decoder = new TextDecoder();
                var buffer = '';

                function read() {
                    reader.read().then(function(result) {
                        if (result.done) {
                            return;
                        }

                        buffer += decoder.decode(result.value, { stream: true });

                        // Parse SSE events from buffer
                        var lines = buffer.split('\n');
                        buffer = lines.pop(); // Keep incomplete line in buffer

                        var currentEvent = { type: 'message', data: '' };

                        for (var i = 0; i < lines.length; i++) {
                            var line = lines[i];

                            if (line.startsWith('event:')) {
                                currentEvent.type = line.substring(6).trim();
                            } else if (line.startsWith('data:')) {
                                currentEvent.data = line.substring(5).trim();
                            } else if (line === '') {
                                // Empty line means end of event
                                if (currentEvent.data) {
                                    app.ports.gitHubSSEEvent.send(currentEvent);

                                    // Stop reading on success or error
                                    if (currentEvent.type === 'success' || currentEvent.type === 'error') {
                                        return;
                                    }
                                }
                                currentEvent = { type: 'message', data: '' };
                            }
                        }

                        read(); // Continue reading
                    }).catch(function(error) {
                        app.ports.gitHubSSEEvent.send({
                            type: 'error',
                            data: 'Connection error: ' + error.message
                        });
                    });
                }

                read();
            }).catch(function(error) {
                app.ports.gitHubSSEEvent.send({
                    type: 'error',
                    data: 'Failed to start SSE: ' + error.message
                });
            });
        }

        // Track build logs SSE connection
        var buildLogsReader = null;
        var buildLogsAbortController = null;

        // Port: Start build logs SSE connection
        app.ports.startBuildLogsSSE.subscribe(function(config) {
            // Close any existing connection
            if (buildLogsAbortController) {
                buildLogsAbortController.abort();
            }

            buildLogsAbortController = new AbortController();

            var url = '/api/apps/' + encodeURIComponent(config.appName) +
                      '/builds/' + encodeURIComponent(config.buildId) +
                      '/logs?follow=true';

            fetch(url, {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + config.token,
                    'Accept': 'text/event-stream'
                },
                signal: buildLogsAbortController.signal
            }).then(function(response) {
                if (!response.ok) {
                    app.ports.buildLogsSSEEvent.send({
                        type: 'error',
                        data: 'Failed to connect: ' + response.status
                    });
                    return;
                }

                buildLogsReader = response.body.getReader();
                var decoder = new TextDecoder();
                var buffer = '';

                function read() {
                    buildLogsReader.read().then(function(result) {
                        if (result.done) {
                            app.ports.buildLogsSSEEvent.send({
                                type: 'done',
                                data: 'stream_ended'
                            });
                            return;
                        }

                        buffer += decoder.decode(result.value, { stream: true });

                        // Parse SSE events from buffer
                        var lines = buffer.split('\n');
                        buffer = lines.pop(); // Keep incomplete line in buffer

                        var currentEvent = { type: 'message', data: '' };

                        for (var i = 0; i < lines.length; i++) {
                            var line = lines[i];

                            if (line.startsWith('event:')) {
                                currentEvent.type = line.substring(6).trim();
                            } else if (line.startsWith('data:')) {
                                currentEvent.data = line.substring(5).trim();
                            } else if (line === '') {
                                // Empty line means end of event
                                if (currentEvent.data || currentEvent.type === 'done') {
                                    app.ports.buildLogsSSEEvent.send(currentEvent);

                                    // Stop reading on done or error
                                    if (currentEvent.type === 'done' || currentEvent.type === 'error') {
                                        return;
                                    }
                                }
                                currentEvent = { type: 'message', data: '' };
                            }
                        }

                        read(); // Continue reading
                    }).catch(function(error) {
                        if (error.name !== 'AbortError') {
                            app.ports.buildLogsSSEEvent.send({
                                type: 'error',
                                data: 'Connection error: ' + error.message
                            });
                        }
                    });
                }

                read();
            }).catch(function(error) {
                if (error.name !== 'AbortError') {
                    app.ports.buildLogsSSEEvent.send({
                        type: 'error',
                        data: 'Failed to start SSE: ' + error.message
                    });
                }
            });
        });

        // Port: Stop build logs SSE connection
        app.ports.stopBuildLogsSSE.subscribe(function() {
            if (buildLogsAbortController) {
                buildLogsAbortController.abort();
                buildLogsAbortController = null;
            }
            buildLogsReader = null;
        });
    </script>
</body>
</html>
