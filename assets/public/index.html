<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litehouse Admin</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-litehouse-bg text-litehouse-text">
    <div id="elm"></div>
    <script src="/app.js?v=2"></script>
    <script>
/**
 * SSEManager - Manages a single SSE connection with automatic reconnection
 * and server-side filtering for real-time backend-to-frontend messaging.
 */
class SSEManager {
  constructor(baseUrl, token, onMessage, onStateChange) {
    this.baseUrl = baseUrl;
    this.token = token;
    this.onMessage = onMessage;
    this.onStateChange = onStateChange;

    this.state = 'disconnected'; // connecting | connected | disconnected | error
    this.abortController = null;
    this.reconnectAttempts = 0;
    this.maxReconnectAttempts = Infinity;
    this.reconnectDelays = [1000, 2000, 4000, 8000, 30000]; // Exponential backoff with max 30s
    this.reconnectTimeout = null;
    this.heartbeatTimeout = null;
    this.heartbeatInterval = 45000; // 45 seconds - disconnect if no message
    
    // Message throttling
    this.messageQueue = [];
    this.throttleInterval = 100; // Process messages every 100ms (max 10 messages/second)
    this.throttleTimeout = null;
    this.lastFilters = {}; // Store last filters for reconnection
  }

  /**
   * Connect to the SSE endpoint with optional filters
   * @param {Object} filters - Optional filters { message_types: ['Type1', 'Type2'], app_names: ['app1'] }
   */
  connect(filters = {}) {
    if (this.abortController) {
      this.abortController.abort();
    }

    // Store filters for reconnection
    this.lastFilters = filters;

    this.abortController = new AbortController();
    this.setState('connecting');

    // Build query string from filters
    const params = new URLSearchParams();
    if (filters.message_types && filters.message_types.length > 0) {
      params.append('message_types', filters.message_types.join(','));
    }
    if (filters.app_names && filters.app_names.length > 0) {
      params.append('app_names', filters.app_names.join(','));
    }

    const url = `${this.baseUrl}/api/events/stream?${params.toString()}`;

    fetch(url, {
      headers: {
        'Authorization': `Bearer ${this.token}`,
        'Accept': 'text/event-stream',
      },
      signal: this.abortController.signal,
    })
    .then(response => {
      if (!response.ok) {
        throw new Error(`SSE connection failed: ${response.status} ${response.statusText}`);
      }

      this.setState('connected');
      this.reconnectAttempts = 0; // Reset reconnect attempts on successful connection
      this.resetHeartbeatTimeout();

      return response.body;
    })
    .then(body => {
      const reader = body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      const processChunk = ({ done, value }) => {
        if (done) {
          console.log('SSE stream ended');
          this.handleDisconnect();
          return;
        }

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // Keep incomplete line in buffer

        let currentEvent = null;
        let currentData = '';

        for (const line of lines) {
          if (line.startsWith('event:')) {
            currentEvent = line.substring(6).trim();
          } else if (line.startsWith('data:')) {
            currentData = line.substring(5).trim();
          } else if (line === '') {
            // Empty line marks end of event
            if (currentEvent && currentData) {
              this.handleMessage(currentEvent, currentData);
              currentEvent = null;
              currentData = '';
            }
          } else if (line.startsWith(':')) {
            // Comment line (keep-alive), ignore
            this.resetHeartbeatTimeout();
          }
        }

        return reader.read().then(processChunk);
      };

      return reader.read().then(processChunk);
    })
    .catch(error => {
      if (error.name === 'AbortError') {
        console.log('SSE connection aborted');
        return;
      }
      console.error('SSE connection error:', error);
      this.setState('error');
      this.handleDisconnect();
    });
  }

  /**
   * Parse and handle an SSE message (with throttling)
   */
  handleMessage(eventType, data) {
    this.resetHeartbeatTimeout();

    try {
      if (eventType === 'heartbeat' || eventType === 'keep-alive') {
        // Just a heartbeat, don't send to onMessage
        return;
      }

      // Parse JSON data
      const parsedData = JSON.parse(data);

      // Add to queue for throttled processing
      this.messageQueue.push({
        type: eventType,
        data: parsedData,
      });

      // Start throttling timer if not already running
      if (!this.throttleTimeout) {
        this.processMessageQueue();
      }
    } catch (error) {
      console.error('Failed to parse SSE message:', error, { eventType, data });
    }
  }

  /**
   * Process queued messages with throttling
   */
  processMessageQueue() {
    if (this.messageQueue.length === 0) {
      this.throttleTimeout = null;
      return;
    }

    // Process one message from the queue
    const message = this.messageQueue.shift();
    this.onMessage(message);

    // Schedule next message processing
    this.throttleTimeout = setTimeout(() => {
      this.processMessageQueue();
    }, this.throttleInterval);
  }

  /**
   * Disconnect and optionally reconnect
   */
  handleDisconnect() {
    if (this.heartbeatTimeout) {
      clearTimeout(this.heartbeatTimeout);
      this.heartbeatTimeout = null;
    }

    if (this.state === 'disconnected') {
      return; // Already disconnected
    }

    this.setState('disconnected');
    this.handleReconnect();
  }

  /**
   * Handle reconnection with exponential backoff
   */
  handleReconnect() {
    if (this.reconnectAttempts >= this.maxReconnectAttempts) {
      console.error('Max reconnect attempts reached');
      this.setState('error');
      return;
    }

    const delayIndex = Math.min(this.reconnectAttempts, this.reconnectDelays.length - 1);
    const delay = this.reconnectDelays[delayIndex];

    console.log(`Reconnecting in ${delay}ms (attempt ${this.reconnectAttempts + 1})...`);

    this.reconnectTimeout = setTimeout(() => {
      this.reconnectAttempts++;
      this.connect(this.lastFilters || {});
    }, delay);
  }

  /**
   * Reset the heartbeat timeout
   */
  resetHeartbeatTimeout() {
    if (this.heartbeatTimeout) {
      clearTimeout(this.heartbeatTimeout);
    }

    this.heartbeatTimeout = setTimeout(() => {
      console.warn('No heartbeat received, disconnecting...');
      this.handleDisconnect();
    }, this.heartbeatInterval);
  }

  /**
   * Disconnect from SSE
   */
  disconnect() {
    if (this.reconnectTimeout) {
      clearTimeout(this.reconnectTimeout);
      this.reconnectTimeout = null;
    }

    if (this.heartbeatTimeout) {
      clearTimeout(this.heartbeatTimeout);
      this.heartbeatTimeout = null;
    }

    if (this.throttleTimeout) {
      clearTimeout(this.throttleTimeout);
      this.throttleTimeout = null;
    }

    // Clear message queue
    this.messageQueue = [];

    if (this.abortController) {
      this.abortController.abort();
      this.abortController = null;
    }

    this.setState('disconnected');
  }

  /**
   * Update connection state
   */
  setState(newState) {
    if (this.state !== newState) {
      this.state = newState;
      console.log('SSE state:', newState);
      if (this.onStateChange) {
        this.onStateChange(newState);
      }
    }
  }

  /**
   * Update token (e.g., after refresh)
   */
  updateToken(newToken) {
    this.token = newToken;
    // Reconnect with new token if currently connected
    if (this.state === 'connected' || this.state === 'connecting') {
      this.disconnect();
      this.connect(this.lastFilters || {});
    }
  }

  /**
   * Update filters and reconnect if needed
   */
  updateFilters(filters = {}) {
    this.lastFilters = filters;
    // If connected, reconnect with new filters
    if (this.state === 'connected' || this.state === 'connecting') {
      this.disconnect();
      this.connect(filters);
    }
  }
}

// Export for use in modules or global scope
if (typeof module !== 'undefined' && module.exports) {
  module.exports = SSEManager;
} else {
  window.SSEManager = SSEManager;
}
    </script>
    <script>
        // Suppress harmless browser extension errors
        window.addEventListener('unhandledrejection', function(event) {
            // Filter out common browser extension message channel errors
            if (event.reason && typeof event.reason === 'object') {
                var message = event.reason.message || String(event.reason);
                if (message.includes('message channel closed') || 
                    message.includes('asynchronous response')) {
                    event.preventDefault();
                    return;
                }
            }
            // Log other unhandled rejections for debugging
            console.error('Unhandled promise rejection:', event.reason);
        });

        // Token storage keys
        var TOKEN_KEY = 'litehouse_token';
        var REFRESH_TOKEN_KEY = 'litehouse_refresh_token';

        // Get stored tokens
        var storedToken = localStorage.getItem(TOKEN_KEY);
        var storedRefreshToken = localStorage.getItem(REFRESH_TOKEN_KEY);

        // Initialize Elm app with flags
        var app = Elm.Main.init({
            node: document.getElementById('elm'),
            flags: {
                token: storedToken
            }
        });

        // Port: Save token to localStorage
        app.ports.saveToken.subscribe(function(token) {
            localStorage.setItem(TOKEN_KEY, token);
        });

        // Port: Save refresh token to localStorage
        app.ports.saveRefreshToken.subscribe(function(refreshToken) {
            localStorage.setItem(REFRESH_TOKEN_KEY, refreshToken);
        });

        // Port: Get refresh token from localStorage
        app.ports.getRefreshToken.subscribe(function() {
            var refreshToken = localStorage.getItem(REFRESH_TOKEN_KEY);
            app.ports.refreshTokenReceived.send(refreshToken);
        });

        // Port: Clear tokens from localStorage
        app.ports.clearToken.subscribe(function() {
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(REFRESH_TOKEN_KEY);
        });

        // Unified SSE Manager
        var sseManager = null;

        // Port: Connect to unified SSE endpoint
        app.ports.connectSSE.subscribe(function(config) {
            var token = config.token;
            var filters = config.filters;

            // Disconnect existing connection if any
            if (sseManager) {
                sseManager.disconnect();
            }

            // Parse filters from Elm's Maybe Value
            var parsedFilters = {};
            if (filters) {
                try {
                    parsedFilters = filters;
                } catch (e) {
                    console.error('Failed to parse SSE filters:', e);
                }
            }

            // Create new SSE manager
            sseManager = new SSEManager(
                window.location.origin,
                token,
                function(event) {
                    // Send events to Elm via sseEvent port
                    app.ports.sseEvent.send(event);
                },
                function(state) {
                    // Send connection state to Elm via sseConnectionState port
                    app.ports.sseConnectionState.send(state);
                }
            );

            // Connect with filters
            sseManager.connect(parsedFilters);
        });

        // Port: Disconnect from SSE
        app.ports.disconnectSSE.subscribe(function() {
            if (sseManager) {
                sseManager.disconnect();
                sseManager = null;
            }
        });

        // Port: Update SSE filters (reconnects with new filters)
        app.ports.updateSSEFilters.subscribe(function(config) {
            if (!sseManager) {
                console.warn('Cannot update SSE filters: SSE manager not initialized');
                return;
            }

            var filters = config.filters;

            // Parse filters from Elm's Maybe Value
            var parsedFilters = {};
            if (filters) {
                try {
                    parsedFilters = filters;
                } catch (e) {
                    console.error('Failed to parse SSE filters:', e);
                }
            }

            // Update filters (will reconnect if connected)
            sseManager.updateFilters(parsedFilters);
        });
    </script>
</body>
</html>
