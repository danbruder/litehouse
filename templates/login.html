{% extends "base.html" %}

{% block title %}login - litehouse{% endblock %}

{% block content %}
<div class="terminal-shell">
  <div class="login-box">
    <p class="lede">litehouse://admin</p>
    <div class="card">
      <span class="panel-label">access</span>
      {% if let Some(err) = error %}
      <p class="error">{{ err }}</p>
      {% endif %}
      <form method="post" action="/login">
        <label class="field-label" for="token">admin token</label>
        <div class="prompt-row">
          <span class="prompt-marker">&gt;</span>
          <input type="password" id="token" name="token" placeholder="••••••••••••••••" autofocus>
        </div>
        <button type="submit">authenticate</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
