{% extends "base.html" %}

{% block title %}login - litehouse{% endblock %}

{% block content %}
<div class="login-box">
  <h2>Sign in</h2>
  {% if let Some(err) = error %}
  <p class="error">{{ err }}</p>
  {% endif %}
  <form method="post" action="/login">
    <p>
      <input type="password" name="token" placeholder="admin token" autofocus>
    </p>
    <p>
      <input type="submit" value="Sign in">
    </p>
  </form>
</div>
{% endblock %}
