name: Build and Release Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-musl-

      - name: Build release binary
        env:
          TARGET_CC: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/lh dist/
          cd dist
          tar -czvf litehouse-linux-x86_64.tar.gz lh
          sha256sum litehouse-linux-x86_64.tar.gz > litehouse-linux-x86_64.tar.gz.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/litehouse-linux-x86_64.tar.gz
            dist/litehouse-linux-x86_64.tar.gz.sha256
          generate_release_notes: true

      - name: Stage image build context
        run: |
          mkdir -p image-context
          cp target/x86_64-unknown-linux-musl/release/lh image-context/lh
          cp Dockerfile image-context/Dockerfile

      - name: Upload image build context
        uses: actions/upload-artifact@v4
        with:
          name: image-context
          path: image-context/
          retention-days: 1

  publish-image:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
      actions: read # artifact download from the build job

    steps:
      - name: Download image build context
        uses: actions/download-artifact@v4
        with:
          name: image-context
          path: image-context

      - name: Compute image tag (strip leading v)
        id: version
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: image-context
          push: true
          tags: |
            ghcr.io/danbruder/litehouse:${{ steps.version.outputs.version }}
            ghcr.io/danbruder/litehouse:latest

  deploy:
    needs: publish-image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: SSH and upgrade litehouse on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LITEHOUSE_SERVER_HOST }}
          username: ${{ secrets.LITEHOUSE_SERVER_USER }}
          key: ${{ secrets.LITEHOUSE_SERVER_SSH_KEY }}
          script: sudo /usr/local/bin/lh upgrade
