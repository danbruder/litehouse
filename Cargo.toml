[package]
name = "litehouse"
version = "0.1.26"
edition = "2024"
description = "A platform for deploying and running containerized applications"
authors = ["Dan Bruder <danbruder@hey.com>"]

[dependencies]
async-stream = "0.3"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "time", "macros"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features=false, features = ["json", "rustls-tls", "stream", "multipart", "blocking"] }
thiserror = "1.0"
tempfile = "3.9"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
bollard = "0.15"
axum = { version = "0.6", features = ["multipart"] }
tower = "0.4"
hyper = { version = "0.14", features = ["full"] }
http = "0.2"
futures-util = "0.3"
bytes = "1"
indicatif = "0.17"
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2.0"
jsonwebtoken = "9.2"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2.1"
tar = "0.4"
flate2 = "1.0"
walkdir = "2.4"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.9"

[[bin]]
name = "lh"
path = "src/main.rs"

[features]
default = []
vendored-openssl = []
